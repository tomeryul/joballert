<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — JobAlert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Notifications</h1>
          <p class="page-subtitle" id="notif-subtitle">Loading…</p>
        </div>
        <button class="btn btn-secondary" id="mark-all-read-btn">Mark all read</button>
      </div>

      <div class="card" id="notif-list">
        <div class="loading-overlay"><div class="loading-spinner loading-spinner-lg"></div></div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ai-matcher.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/jobs.js"></script>
<script src="js/providers/base-provider.js"></script>
<script src="js/providers/greenhouse.js"></script>
<script src="js/providers/lever.js"></script>
<script src="js/providers/ashby.js"></script>
<script src="js/providers/wellfound.js"></script>
<script src="js/providers/provider-registry.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('sidebar-mount').innerHTML = buildSidebar('notifications');
document.getElementById('topbar-mount').innerHTML = buildTopbar();

(async () => {
  await App.init();
  if (!Auth.requireAuth()) return;

  await loadNotifications();

  document.getElementById('mark-all-read-btn').addEventListener('click', async () => {
    await DB.markAllNotificationsRead(Auth.user.id);
    Toasts.success('Done', 'All notifications marked as read');
    await loadNotifications();
  });
})();

async function loadNotifications() {
  const { data: notifs, error } = await DB.getNotifications(Auth.user.id, 100);
  const container = document.getElementById('notif-list');

  if (error) { container.innerHTML = '<div class="empty-state"><p>Failed to load notifications.</p></div>'; return; }

  const unread = (notifs || []).filter(n => !n.is_read).length;
  document.getElementById('notif-subtitle').textContent =
    `${notifs?.length || 0} total, ${unread} unread`;

  if (!notifs?.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </div>
        <h3>No notifications yet</h3>
        <p>You'll be notified here when new matching jobs appear.</p>
      </div>`;
    return;
  }

  const typeIcon = {
    new_job: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>`,
    system: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    reminder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  };

  container.innerHTML = notifs.map(n => `
    <div class="notification-item ${n.is_read ? '' : 'unread'}" data-id="${n.id}" style="position:relative">
      <div class="notif-icon notif-icon-${n.type === 'new_job' ? 'job' : n.type === 'reminder' ? 'reminder' : 'system'}">
        ${typeIcon[n.type] || typeIcon.system}
      </div>
      <div class="notif-content">
        <div class="notif-title">${Utils.escapeHtml(n.title)}</div>
        ${n.body ? `<div class="notif-body">${Utils.escapeHtml(n.body)}</div>` : ''}
        <div class="notif-time">${Utils.timeAgo(n.created_at)}</div>
      </div>
      ${!n.is_read ? '<div class="notif-dot"></div>' : ''}
    </div>`).join('');

  container.querySelectorAll('.notification-item').forEach(item => {
    item.addEventListener('click', async () => {
      const id = item.dataset.id;
      await DB.markNotificationRead(id);
      item.classList.remove('unread');
      item.querySelector('.notif-dot')?.remove();
    });
  });
}
</script>
</body>
</html>
