<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobAlert — AI-Powered Job Hunting</title>
  <meta name="description" content="AI-powered job hunting assistant for software engineers">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Auth Page */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }

    .auth-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 70%);
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .auth-hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: var(--gradient-primary);
      border-radius: 20px;
      font-size: 2rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-glow-strong);
    }

    .auth-hero h1 {
      font-size: 2rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .auth-hero p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .auth-card {
      background: rgba(15, 22, 41, 0.9);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius-xl);
      padding: 2rem;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg);
    }

    .auth-tabs {
      display: flex;
      background: var(--bg-card);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.75rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 7px;
      cursor: pointer;
      transition: var(--transition);
    }

    .auth-tab.active {
      background: var(--accent-primary);
      color: white;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .auth-divider span {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.6875rem;
      background: var(--bg-input);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 0.75rem;
    }

    .social-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--glass-border-hover);
    }

    .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .auth-features {
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      text-align: center;
    }

    .auth-feature {
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius);
    }

    .auth-feature-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .auth-feature h4 { font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; }
    .auth-feature p { font-size: 0.72rem; color: var(--text-muted); }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    #error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #f87171;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-hero">
        <div class="auth-logo">⚡</div>
        <h1>JobAlert</h1>
        <p>AI-powered job hunting assistant for software engineers</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active" data-tab="signin">Sign In</div>
          <div class="auth-tab" data-tab="signup">Create Account</div>
        </div>

        <div id="error-msg"></div>

        <!-- Social Auth -->
        <button class="social-btn" id="github-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          Continue with GitHub
        </button>
        <button class="social-btn" id="google-btn">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div class="auth-divider"><span>or continue with email</span></div>

        <!-- Sign In -->
        <div class="form-panel active" id="signin-panel">
          <form id="signin-form">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="signin-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="signin-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" id="signin-btn">Sign In</button>
          </form>
        </div>

        <!-- Sign Up -->
        <div class="form-panel" id="signup-panel">
          <form id="signup-form">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="signup-name" placeholder="Your name" required autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="signup-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="signup-password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" id="signup-btn">Create Account</button>
          </form>
        </div>
      </div>

      <div class="auth-features">
        <div class="auth-feature">
          <div class="auth-feature-icon">🤖</div>
          <h4>AI Matching</h4>
          <p>Smart 0–100 match scores</p>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon">⚡</div>
          <h4>Real-time</h4>
          <p>Live job notifications</p>
        </div>
        <div class="auth-feature">
          <div class="auth-feature-icon">📊</div>
          <h4>Tracker</h4>
          <p>Full application pipeline</p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    Toasts.init();

    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-panel`).classList.add('active');
        hideError();
      });
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-msg').style.display = 'none';
    }

    // Check if already logged in
    (async () => {
      const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    // Sign In
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('signin-btn');
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Signing in…';

      try {
        const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'dashboard.html';
      } catch (err) {
        const msg = err.message || '';
        if (msg.toLowerCase().includes('email not confirmed')) {
          showError('Please confirm your email first. Check your inbox for a confirmation link.');
        } else if (msg.toLowerCase().includes('invalid login credentials')) {
          showError('Incorrect email or password.');
        } else {
          showError(msg || 'Sign in failed. Please check your credentials.');
        }
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });

    // Sign Up
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('signup-btn');
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Creating account…';

      try {
        const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) throw error;

        // If email confirmation is disabled, session is returned immediately
        if (data.session) {
          window.location.href = 'dashboard.html';
          return;
        }

        // Email confirmation required — switch to sign-in tab with a message
        Toasts.success('Account created!', 'Check your email to confirm, then sign in here.');
        document.querySelector('[data-tab="signin"]').click();
        document.getElementById('signin-email').value = email;
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      } catch (err) {
        showError(err.message || 'Sign up failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    });

    // OAuth — preflight check before redirecting so we can show a friendly error
    async function tryOAuth(provider) {
      hideError();
      const redirectTo = `${location.origin}${location.pathname.replace('index.html', '')}dashboard.html`;
      const checkUrl = `${CONFIG.SUPABASE_URL}/auth/v1/authorize?provider=${provider}&redirect_to=${encodeURIComponent(redirectTo)}`;
      try {
        const res = await fetch(checkUrl, { redirect: 'manual' });
        // opaqueredirect (status 0) = Supabase is redirecting us to the OAuth provider = it's working
        if (res.type === 'opaqueredirect' || res.status === 0) {
          window.location.href = checkUrl;
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (data.error_code === 'validation_failed' || data.msg?.includes('not enabled')) {
          showError(`${provider === 'github' ? 'GitHub' : 'Google'} OAuth is not enabled yet. Use email/password to sign in, or enable the provider in the Supabase Dashboard → Authentication → Providers.`);
        } else {
          showError(data.msg || `${provider} login failed.`);
        }
      } catch {
        // CORS or network error — just try redirecting directly
        window.location.href = checkUrl;
      }
    }

    document.getElementById('github-btn').addEventListener('click', () => tryOAuth('github'));
    document.getElementById('google-btn').addEventListener('click', () => tryOAuth('google'));
  </script>
</body>
</html>
