<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended — JobAlert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    @media(max-width:640px) { .rec-grid { grid-template-columns: 1fr; } }
    .score-filter-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .score-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .score-btn.active { background: var(--accent-primary); border-color: var(--accent-primary); color: white; }
    .ai-banner {
      background: linear-gradient(135deg, rgba(99,102,241,.1), rgba(139,92,246,.1));
      border: 1px solid rgba(99,102,241,.25);
      border-radius: var(--border-radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .ai-banner-icon { font-size: 2rem; flex-shrink: 0; }
    .ai-banner h3 { font-size: .95rem; margin-bottom: .25rem; }
    .ai-banner p { font-size: .8rem; color: var(--text-secondary); }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">AI Recommended</h1>
          <p class="page-subtitle" id="rec-subtitle">Calculating matches…</p>
        </div>
        <a href="settings.html#profile" class="btn btn-secondary">Update Profile</a>
      </div>

      <div class="ai-banner">
        <div class="ai-banner-icon">🤖</div>
        <div>
          <h3>Smart Matching Active</h3>
          <p>Scoring based on your skills (JavaScript, React, Java, Python + more), MSc CS degree, and junior/mid-level targets.</p>
        </div>
      </div>

      <div class="score-filter-bar">
        <span class="text-sm text-muted" style="flex-shrink:0">Min Score:</span>
        <button class="score-btn" data-min="90">90%+ Excellent</button>
        <button class="score-btn active" data-min="70">70%+ Strong</button>
        <button class="score-btn" data-min="50">50%+ Good</button>
        <button class="score-btn" data-min="0">All</button>
        <select id="rec-remote" class="form-control" style="width:auto;padding:.4rem .875rem;font-size:.8rem">
          <option value="any">Any Location</option>
          <option value="remote">Remote Only</option>
          <option value="hybrid">Hybrid</option>
        </select>
      </div>

      <div class="rec-grid" id="rec-grid">
        <div class="loading-overlay" style="grid-column:1/-1">
          <div class="loading-spinner loading-spinner-lg"></div>
          <p class="text-muted">Calculating AI match scores…</p>
        </div>
      </div>
      <div id="pagination-mount"></div>
    </main>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ai-matcher.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/jobs.js"></script>
<script src="js/providers/base-provider.js"></script>
<script src="js/providers/greenhouse.js"></script>
<script src="js/providers/lever.js"></script>
<script src="js/providers/ashby.js"></script>
<script src="js/providers/linkedin.js"></script>
<script src="js/providers/drushim.js"></script>
<script src="js/providers/wellfound.js"></script>
<script src="js/providers/provider-registry.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('sidebar-mount').innerHTML = buildSidebar('recommended');
document.getElementById('topbar-mount').innerHTML = buildTopbar();

let minScore = 70;
const grid = document.getElementById('rec-grid');

(async () => {
  await App.init();
  if (!Auth.requireAuth()) return;
  await JobManager.init();
  await loadRecommended();

  document.querySelectorAll('.score-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      minScore = parseInt(btn.dataset.min);
      loadRecommended();
    });
  });

  document.getElementById('rec-remote').addEventListener('change', loadRecommended);
  JobManager.initCardActions(grid);
})();

async function loadRecommended() {
  grid.innerHTML = JobManager.renderSkeletons(6);
  const profile = Auth.getEffectiveProfile();
  const remote = document.getElementById('rec-remote')?.value || 'any';

  const { data: jobs } = await DB.getJobs({ remote: remote !== 'any' ? remote : undefined, limit: 100, cities: Auth.getEffectiveProfile().preferred_locations || [] });

  const scored = (jobs || [])
    .map(job => {
      const m = AIMatcher.match(job, profile);
      return { ...job, _match: m };
    })
    .filter(j => j._match.score >= minScore)
    .sort((a, b) => b._match.score - a._match.score);

  document.getElementById('rec-subtitle').textContent =
    `${scored.length} jobs match your profile with ${minScore}%+ score`;

  if (!scored.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🤖</div>
        <h3>No matches at ${minScore}%+ yet</h3>
        <p>Try lowering the minimum score or updating your profile to improve matches.</p>
        <a href="settings.html" class="btn btn-primary" style="margin-top:.5rem">Update Profile</a>
      </div>`;
    return;
  }

  grid.innerHTML = scored.map(job => JobManager.renderJobCard(job)).join('');
}
</script>
</body>
</html>
