<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Jobs — JobAlert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    @media(max-width:640px) { .saved-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <main class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Saved Jobs</h1>
          <p class="page-subtitle" id="saved-count">Loading…</p>
        </div>
        <a href="jobs.html" class="btn btn-primary">Browse More</a>
      </div>

      <div class="saved-grid" id="saved-grid">
        <div class="loading-overlay" style="grid-column:1/-1">
          <div class="loading-spinner loading-spinner-lg"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ai-matcher.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
<script src="js/jobs.js"></script>
<script src="js/providers/base-provider.js"></script>
<script src="js/providers/greenhouse.js"></script>
<script src="js/providers/lever.js"></script>
<script src="js/providers/ashby.js"></script>
<script src="js/providers/linkedin.js"></script>
<script src="js/providers/drushim.js"></script>
<script src="js/providers/wellfound.js"></script>
<script src="js/providers/provider-registry.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('sidebar-mount').innerHTML = buildSidebar('saved');
document.getElementById('topbar-mount').innerHTML = buildTopbar();

(async () => {
  await App.init();
  if (!Auth.requireAuth()) return;
  await JobManager.init();

  const { data: userJobs, error } = await DB.getUserJobs(Auth.user.id, 'saved');
  const grid = document.getElementById('saved-grid');

  if (error) { Toasts.error('Error', error.message); return; }

  const jobs = (userJobs || []).map(uj => uj.jobs).filter(Boolean);
  document.getElementById('saved-count').textContent = `${jobs.length} saved job${jobs.length !== 1 ? 's' : ''}`;

  if (!jobs.length) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </div>
        <h3>No saved jobs yet</h3>
        <p>Browse jobs and click the bookmark icon to save positions you're interested in.</p>
        <a href="jobs.html" class="btn btn-primary" style="margin-top:.5rem">Browse Jobs</a>
      </div>`;
    return;
  }

  const profile = Auth.getEffectiveProfile();
  grid.innerHTML = jobs.map(job => {
    const match = AIMatcher.match(job, profile);
    JobManager._matchCache = JobManager._matchCache || {};
    JobManager._matchCache[job.id] = match;
    return JobManager.renderJobCard(job);
  }).join('');

  JobManager.initCardActions(grid);
})();
</script>
</body>
</html>
